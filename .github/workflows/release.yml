name: release

# Push a tag like v1.3.0 (or run manually) to build installers for every OS and
# attach them to a GitHub Release. File names never change, so
# https://github.com/ferdousmikdad/Homeport/releases/latest/download/<name>
# always serves the newest version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller pywebview
      - name: Build .app and .dmg
        run: |
          V="${VERSION#v}"
          ./packaging/build_macos.sh "$V"
          ditto -c -k --keepParent dist/Homeport.app dist/Homeport-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Homeport-mac-arm64.dmg
            dist/Homeport-mac-arm64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install build tools
        run: |
          python -m pip install -r requirements.txt pyinstaller pywebview
          choco install innosetup -y --no-progress
      - name: Build app, installer and portable zip
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v')
          $env:HOMEPORT_VERSION = $v
          pyinstaller packaging/homeport.spec --noconfirm --clean
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\homeport.iss
          Compress-Archive -Path dist\Homeport\* -DestinationPath dist\Homeport-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Homeport-Setup-x64.exe
            dist/Homeport-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install build tools
        # no pywebview here: on Linux Homeport opens in the default browser,
        # which avoids bundling a whole GTK/Qt web engine.
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build AppImage and .deb
        run: |
          V="${VERSION#v}"
          ./packaging/build_linux.sh "$V"
          mv "dist/homeport_${V}_amd64.deb" dist/homeport_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Homeport-x86_64.AppImage
            dist/homeport_amd64.deb

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Homeport ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
